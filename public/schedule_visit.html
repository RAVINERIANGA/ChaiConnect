<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Extension Services | chaiConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
  <link rel="stylesheet" href="/css/farmer_dashboard.css"/>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f7f9fc;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: auto;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 0 15px rgba(0,0,0,0.05);
      margin-bottom: 30px;
    }
    .card h2 {
      margin-bottom: 20px;
      font-size: 24px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      font-weight: 500;
      margin-bottom: 5px;
    }
    .form-control {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    .btn-submit {
      padding: 10px 20px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-submit:hover {
      background-color: #218838;
    }
    .success-message {
      display: none;
      padding: 10px;
      background-color: #d4edda;
      color: #155724;
      border-radius: 6px;
      margin-bottom: 15px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      padding: 12px;
      border: 1px solid #ddd;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2>Request Extension Visit</h2>
      <div class="success-message" id="successMessage">
        <i class="fas fa-check-circle"></i> Visit request submitted successfully!
      </div>
      <form id="visitRequestForm">
        <div class="form-group">
          <label for="visitDate">Preferred Date</label>
          <input type="date" id="visitDate" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="visitTime">Preferred Time</label>
          <input type="time" id="visitTime" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="visitPurpose">Purpose</label>
          <select id="visitPurpose" class="form-control" required>
            <option value="">-- Select purpose --</option>
            <option value="routine_check">Routine Check</option>
            <option value="training">Training</option>
            <option value="problem_solving">Problem Solving</option>
            <option value="harvest_advice">Harvest Advice</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="visitNotes">Additional Notes</label>
          <textarea id="visitNotes" class="form-control"></textarea>
        </div>
        <button type="submit" class="btn-submit"><i class="fas fa-paper-plane"></i> Submit Request</button>
      </form>
    </div>

    <div class="card">
      <h2>Your Visit Requests</h2>
      <table id="visitRequestsTable">
        <thead>
          <tr>
            <th>Officer</th>
            <th>Preferred Date</th>
            <th>Purpose</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <!-- Visit requests will be inserted here -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function fetchVisitRequests() {
      const res = await fetch('/api/farmer/my-visit-requests', { credentials: 'include' });
      const data = await res.json();
      const tbody = document.querySelector('#visitRequestsTable tbody');
      tbody.innerHTML = '';

      if (data.success && data.visits.length > 0) {
        data.visits.forEach(v => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${v.officer_name}</td>
            <td>${new Date(v.preferred_date).toLocaleString()}</td>
            <td>${v.purpose}</td>
            <td>${v.status}</td>
          `;
          tbody.appendChild(tr);
        });
      }
    }

    document.getElementById('visitRequestForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const visitDate = document.getElementById('visitDate').value;
      const visitTime = document.getElementById('visitTime').value;
      const purpose = document.getElementById('visitPurpose').value;
      const notes = document.getElementById('visitNotes').value;

      const visit_datetime = `${visitDate}T${visitTime}:00`;

      const res = await fetch('/api/farmer/request-extension-visit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ visit_datetime, purpose, notes })
      });

      const data = await res.json();
      if (data.success) {
        document.getElementById('successMessage').style.display = 'block';
        document.getElementById('visitRequestForm').reset();
        fetchVisitRequests();
        setTimeout(() => {
          document.getElementById('successMessage').style.display = 'none';
        }, 4000);
      } else {
        alert(data.message || 'Failed to submit request');
      }
    });

    document.addEventListener('DOMContentLoaded', fetchVisitRequests);
  </script>
  <script src="logout.js"></script>
  <script src="/alertCount.js"></script>
</body>
</html>
