<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Extension Services | chaiConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
  <link rel="stylesheet" href="/css/farmer_dashboard.css"/>
  <style>
    .container {
      max-width: 800px;
      margin: 40px auto;
      background: #fff;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      font-family: 'Poppins', sans-serif;
    }
    h2 { margin-bottom: 20px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { font-weight: 500; display: block; margin-bottom: 8px; }
    .form-control { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; }
    textarea.form-control { min-height: 100px; resize: vertical; }
    .btn-submit {
      background-color: #28a745;
      color: #fff;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-submit:hover { background-color: #218838; }
    table { width: 100%; border-collapse: collapse; margin-top: 30px; }
    th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    th { background-color: #f5f5f5; }
    .success-message {
      background: #d4edda;
      color: #155724;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Request Extension Visit</h2>
    <div class="success-message" id="successMessage">
      <i class="fas fa-check-circle"></i> Visit request submitted successfully!
    </div>
    <form id="visitRequestForm">
      <div class="form-group">
        <label for="visitDate">Preferred Visit Date</label>
        <input type="date" id="visitDate" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="visitTime">Preferred Visit Time</label>
        <input type="time" id="visitTime" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="visitPurpose">Purpose</label>
        <select id="visitPurpose" class="form-control" required>
          <option value="">-- Select purpose --</option>
          <option value="routine_check">Routine Check</option>
          <option value="training">Training</option>
          <option value="problem_solving">Problem Solving</option>
          <option value="harvest_advice">Harvest Advice</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="visitNotes">Additional Notes</label>
        <textarea id="visitNotes" class="form-control"></textarea>
      </div>
      <button type="submit" class="btn-submit">Submit Request</button>
    </form>

  <h2 style="margin-top: 50px;">Your Visit Requests</h2>
<table>
  <thead>
    <tr>
      <th>Preferred Date</th>
      <th>Purpose</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody id="visitHistoryTable"></tbody>
</table>
  </div>

  <script>
    document.getElementById('visitRequestForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const visitDate = document.getElementById('visitDate').value;
      const visitTime = document.getElementById('visitTime').value;
      const purpose = document.getElementById('visitPurpose').value;
      const notes = document.getElementById('visitNotes').value;
      const visit_datetime = `${visitDate}T${visitTime}:00`;

      const res = await fetch('/api/farmer/request-extension-visit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ visit_datetime, purpose, notes })
      });

      const data = await res.json();

      if (data.success) {
        document.getElementById('successMessage').style.display = 'block';
        this.reset();
        loadVisitHistory();
        setTimeout(() => {
          document.getElementById('successMessage').style.display = 'none';
        }, 5000);
      } else {
        alert(data.message || 'Failed to submit request.');
      }
    });

    async function loadVisitHistory() {
      const res = await fetch('/api/farmer/my-visit-requests', { credentials: 'include' });
      const data = await res.json();
      const tbody = document.getElementById('visitHistoryTable');
      tbody.innerHTML = '';

      if (data.success) {
  data.visits.forEach(v => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${new Date(v.preferred_date).toLocaleString()}</td>
      <td>${v.purpose.replaceAll('_', ' ')}</td>
      <td>${v.status}</td>
    `;
    tbody.appendChild(tr);
  });
} else {
  tbody.innerHTML = '<tr><td colspan="3">No visit requests found</td></tr>';
}

    }

    document.addEventListener('DOMContentLoaded', loadVisitHistory);
  </script>
</body>
</html>
