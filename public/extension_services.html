<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extension Services | chaiConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #3498db;
      --success-color: #2ecc71;
      --danger-color: #e74c3c;
      --text-color: #2c3e50;
      --light-gray: #f7f9fc;
      --border-color: #ddd;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--light-gray);
      margin: 0;
      padding: 20px;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }
    
    h2 {
      color: var(--primary-color);
      margin-bottom: 25px;
      font-size: 24px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text-color);
    }
    
    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
    }
    
    textarea {
      min-height: 100px;
      resize: vertical;
    }
    
    .btn-submit {
      background-color: var(--primary-color);
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    
    .btn-submit:hover {
      background-color: #2980b9;
    }
    
    .notification {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    
    .success {
      background-color: rgba(46, 204, 113, 0.1);
      color: var(--success-color);
      border: 1px solid rgba(46, 204, 113, 0.3);
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 30px;
    }
    
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }
    
    th {
      background-color: var(--light-gray);
      font-weight: 500;
    }
    
    .status-pending {
      color: #e67e22;
    }
    
    .status-scheduled {
      color: var(--primary-color);
    }
    
    .status-completed {
      color: var(--success-color);
    }
    
    .status-cancelled {
      color: var(--danger-color);
    }
    
    .btn-cancel {
      background-color: var(--danger-color);
      color: white;
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2><i class="fas fa-calendar-plus"></i> Request Extension Visit</h2>
    
    <div id="notification" class="notification"></div>
    
    <form id="visitRequestForm">
      <div class="form-group">
        <label for="visitDate">Preferred Visit Date</label>
        <input type="date" id="visitDate" class="form-control" required min="">
      </div>
      
      <div class="form-group">
        <label for="visitTime">Preferred Visit Time</label>
        <input type="time" id="visitTime" class="form-control" required>
      </div>
      
      <div class="form-group">
        <label for="visitPurpose">Purpose</label>
        <select id="visitPurpose" class="form-control" required>
          <option value="">-- Select purpose --</option>
          <option value="routine_check">Routine Check</option>
          <option value="training">Training</option>
          <option value="problem_solving">Problem Solving</option>
          <option value="harvest_advice">Harvest Advice</option>
          <option value="other">Other</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="visitNotes">Additional Notes</label>
        <textarea id="visitNotes" class="form-control" placeholder="Any special requests or information..."></textarea>
      </div>
      
      <button type="submit" class="btn-submit">
        <i class="fas fa-paper-plane"></i> Submit Request
      </button>
    </form>
    
    <h2 style="margin-top: 40px;"><i class="fas fa-history"></i> Your Visit Requests</h2>
    
    <table id="visitHistoryTable">
      <thead>
        <tr>
          <th>Date</th>
          <th>Purpose</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <!-- Visits will be loaded here -->
      </tbody>
    </table>
  </div>

  <script>
    // Set minimum date to today
    document.getElementById('visitDate').min = new Date().toISOString().split('T')[0];
    
    // Form submission
    document.getElementById('visitRequestForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const visitDate = document.getElementById('visitDate').value;
      const visitTime = document.getElementById('visitTime').value;
      const purpose = document.getElementById('visitPurpose').value;
      const notes = document.getElementById('visitNotes').value;
      
      if (!visitDate || !visitTime || !purpose) {
        showNotification('Please fill all required fields', 'error');
        return;
      }
      
      const visit_datetime = `${visitDate}T${visitTime}:00`;
      
      try {
        const response = await fetch('/api/farmer/request-extension-visit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ visit_datetime, purpose, notes })
        });
        
        const data = await response.json();
        
        if (data.success) {
          showNotification('Visit request submitted successfully!', 'success');
          this.reset();
          loadVisitHistory();
        } else {
          throw new Error(data.message || 'Failed to submit request');
        }
      } catch (error) {
        showNotification(error.message, 'error');
        console.error('Error submitting visit request:', error);
      }
    });
    
    // Load visit history
    async function loadVisitHistory() {
      try {
        const response = await fetch('/api/farmer/my-visit-requests', { 
          credentials: 'include' 
        });
        
        const data = await response.json();
        const tbody = document.querySelector('#visitHistoryTable tbody');
        tbody.innerHTML = '';
        
        if (data.success && data.visits.length > 0) {
          data.visits.forEach(visit => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${formatDate(visit.preferred_date)}</td>
              <td>${formatPurpose(visit.purpose)}</td>
              <td class="status-${visit.status}">${formatStatus(visit.status)}</td>
              <td>
                ${visit.status === 'requested' || visit.status === 'scheduled' ? `
                  <button class="btn-cancel" data-id="${visit.visit_id}">
                    <i class="fas fa-times"></i> Cancel
                  </button>
                ` : ''}
              </td>
            `;
            tbody.appendChild(tr);
          });
          
          // Add event listeners to cancel buttons
          document.querySelectorAll('.btn-cancel').forEach(btn => {
            btn.addEventListener('click', cancelVisit);
          });
        } else {
          tbody.innerHTML = `
            <tr>
              <td colspan="4">No visit requests found</td>
            </tr>
          `;
        }
      } catch (error) {
        console.error('Error loading visit history:', error);
        showNotification('Failed to load visit history', 'error');
      }
    }
    
    // Cancel visit
    async function cancelVisit(e) {
      const visitId = e.target.closest('button').dataset.id;
      
      if (!confirm('Are you sure you want to cancel this visit?')) return;
      
      try {
        const response = await fetch(`/api/farmer/cancel-visit/${visitId}`, {
          method: 'PUT',
          credentials: 'include'
        });
        
        const data = await response.json();
        
        if (data.success) {
          showNotification('Visit cancelled successfully', 'success');
          loadVisitHistory();
        } else {
          throw new Error(data.message || 'Failed to cancel visit');
        }
      } catch (error) {
        showNotification(error.message, 'error');
        console.error('Error cancelling visit:', error);
      }
    }
    
    // Helper functions
    function formatDate(dateString) {
      return new Date(dateString).toLocaleString();
    }
    
    function formatPurpose(purpose) {
      return purpose.replace('_', ' ');
    }
    
    function formatStatus(status) {
      return status.charAt(0).toUpperCase() + status.slice(1).replace('_', ' ');
    }
    
    function showNotification(message, type) {
      const notification = document.getElementById('notification');
      notification.textContent = message;
      notification.className = `notification ${type}`;
      notification.style.display = 'block';
      
      setTimeout(() => {
        notification.style.display = 'none';
      }, 5000);
    }
    
    // Initialize on page load
    document.addEventListener('DOMContentLoaded', loadVisitHistory);
  </script>
</body>
</html>
